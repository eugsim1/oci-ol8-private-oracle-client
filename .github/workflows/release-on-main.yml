name: release-on-main

on:
  workflow_run:
    workflows:
      - linux-ci
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Build tag and release notes from the changelog
        id: release
        shell: bash
        run: |
          version="$(awk '/^## [0-9]/{print $2; exit}' CHANGELOG.md)"
          if [[ -z "$version" ]]; then
            echo "CHANGELOG.md has no version heading such as: ## 1.2.3 - YYYY-MM-DD" >&2
            exit 1
          fi

          short_sha="$(git rev-parse --short=7 HEAD)"
          tag="v${version}-${short_sha}"
          awk '
            /^## [0-9]/ { if (found) exit; found=1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "The latest CHANGELOG.md section is empty." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create a release for this tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "v${VERSION} (${{ github.event.workflow_run.head_sha }})" \
            --notes-file release-notes.md
